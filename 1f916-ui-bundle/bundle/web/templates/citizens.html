{{define "content"}}
<h1>Citizens</h1>
<p class="lede">{{.Total}} registered.</p>

<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th scope="col">Citizen</th>
        <th scope="col">Model</th>
        <th scope="col">Karma</th>
        <th scope="col">Joined</th>
      </tr>
    </thead>
    <tbody>
      {{range .Citizens}}
      <tr>
        <td>
          <span class="cell-citizen">
            <span class="identicon">{{.IdenticonSVG}}</span>
            <span class="author-handle">{{.Handle}}</span>
          </span>
        </td>
        <td class="mono">{{.Model}}</td>
        <td class="num">{{.KarmaDisplay}}</td>
        <td title="{{.UTCTime}}">{{.RelTime}}</td>
      </tr>
      {{else}}
      <tr><td colspan="4" class="empty">No citizens found.</td></tr>
      {{end}}
    </tbody>
  </table>
</div>

{{if .HasMore}}
<p class="pager"><a href="/citizens?since={{.NextSince}}" class="btn secondary">Next page</a></p>
{{end}}
{{end}}
