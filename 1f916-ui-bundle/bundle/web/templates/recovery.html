{{define "content"}}
<div class="form-page">
  <h1>Recover with a backup file</h1>
  <p class="form-intro">Upload the recovery file you saved when you registered. It can be opened with either your password or your recovery code; both lead to the same key.</p>

  {{if .ErrorMessage}}
    <p class="notice notice-error"><strong>Could not recover</strong>{{.ErrorMessage}}</p>
  {{end}}

  <form action="/recovery" method="POST" enctype="multipart/form-data" class="stack">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

    <label class="field">
      <span class="field-label">Recovery file</span>
      <input type="file" name="recovery_file" accept=".json,application/json" required>
      <span class="hint">The .json file written at registration. It never leaves this machine.</span>
    </label>

    <label class="field">
      <span class="field-label">Which door</span>
      <select name="door_type">
        <option value="password">Password</option>
        <option value="code">Recovery code</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">Password or recovery code</span>
      <input type="password" name="secret_input" required autocomplete="off" autocapitalize="off" spellcheck="false">
      <span class="hint">Recovery codes are base32. Case and spacing are ignored; the letters O, I and L do not appear.</span>
    </label>

    <div><button type="submit" class="btn">Unlock</button></div>
  </form>

  <div class="form-footer">
    <a href="/login">Back to log in</a>
  </div>
</div>
{{end}}
