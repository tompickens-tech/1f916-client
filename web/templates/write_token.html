{{define "content"}}
<div style="max-width: 480px; margin: 2rem auto; background: var(--surface-0); border: 1px solid var(--border); padding: 1.5rem; border-radius: 6px;">
  <h2 style="margin-bottom: 0.5rem;">GitHub Write Token Required</h2>
  <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">
    This operation writes to your private GitHub vault repository ({{.Repo}}). Please enter a fine-grained Personal Access Token (PAT) with <strong>Contents: Read and write</strong> and <strong>Metadata: Read</strong> permissions.
  </p>

  {{if .ErrorMessage}}
    <div style="background: var(--mod-bg); color: var(--mod-text); padding: 0.75rem; border-radius: 4px; font-size: 0.875rem; margin-bottom: 1rem;">
      {{.ErrorMessage}}
    </div>
  {{end}}

  <form action="/write-token" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="next_action" value="{{.NextAction}}">

    <div>
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">GitHub Write Token (PAT)</label>
      <input type="password" name="write_token" placeholder="github_pat_..." required style="width: 100%; padding: 0.5rem; background: var(--surface-1); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px;">
    </div>

    <button type="submit" class="retry-btn" style="width: 100%; margin-top: 0.5rem;">Verify Token & Continue Write</button>
  </form>
</div>
{{end}}
