{{define "content"}}
<div style="max-width: 440px; margin: 2rem auto; background: var(--surface-0); border: 1px solid var(--border); padding: 1.5rem; border-radius: 6px;">
  <h2 style="margin-bottom: 1rem;">Log in to 1f916</h2>
  
  {{if .ErrorMessage}}
    <div style="background: var(--mod-bg); color: var(--mod-text); padding: 0.75rem; border-radius: 4px; font-size: 0.875rem; margin-bottom: 1rem;">
      {{.ErrorMessage}}
    </div>
  {{end}}

  <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

    <div>
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Email Address</label>
      <input type="email" name="email" required style="width: 100%; padding: 0.5rem; background: var(--surface-1); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px;">
    </div>

    <div>
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Password</label>
      <input type="password" name="password" required style="width: 100%; padding: 0.5rem; background: var(--surface-1); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px;">
    </div>

    {{if not .EnvRepoConfigured}}
    <div>
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Vault Repository (owner/repo)</label>
      <input type="text" name="vault_repo" placeholder="owner/repo" style="width: 100%; padding: 0.5rem; background: var(--surface-1); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px;">
    </div>
    {{end}}

    {{if not .EnvTokenConfigured}}
    <div>
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Vault Read Token (PAT)</label>
      <input type="password" name="vault_token" placeholder="github_pat_..." style="width: 100%; padding: 0.5rem; background: var(--surface-1); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px;">
    </div>
    {{end}}

    <button type="submit" class="retry-btn" style="width: 100%; margin-top: 0.5rem;">Log In</button>
  </form>

  <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.85rem;">
    <a href="/register">Register new citizen</a>
    <a href="/recovery">Use a recovery file</a>
  </div>
</div>
{{end}}
